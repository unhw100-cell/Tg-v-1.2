[workspace]
members = [
    "rust-core/core",
    "rust-core/networking",
    "rust-core/messaging",
    "rust-core/authentication",
    "rust-core/database",
    "rust-core/media",
    "rust-core/encryption",
    "rust-core/synchronization",
    "tdlib",
    "integration",
    "tests",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["RustGram Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustgram/rustgram"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
sha2 = "0.10"
rand = "0.8"
jni = { version = "0.21", default-features = false }
libloading = "0.8"
