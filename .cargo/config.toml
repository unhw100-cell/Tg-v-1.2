# Android linkers are supplied by cargo-ndk from the locally installed NDK.
# Do not hard-code an SDK/NDK path: it differs between machines and Termux.
# Example: ANDROID_NDK_HOME=/path/to/ndk cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
